version = 1

[[annotations]]
path = [
  ".dockerignore",
  ".env.example",
  ".gitattributes",
  ".github/**",
  ".gitignore",
  ".opencode/**",
  "AGENTS.md",
  "NOTICE",
  "VERSION",
  "docker/**",
  "frontend/**",
  "keycloak-webhook-event-listener/**",
  "opencode.json",
  "server/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Sascha Kuhn"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "NOTICE"
precedence = "override"
SPDX-FileCopyrightText = [
  "2013-2022 The Apache Software Foundation",
