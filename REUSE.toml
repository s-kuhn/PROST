]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["README.md", "docs/**/*.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Sascha Kuhn"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ".opencode/skills/arc42-documentation/SKILL.md"
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Sascha Kuhn"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [
  "server/.mvn/wrapper/maven-wrapper.properties",
  "server/mvnw",
  "server/mvnw.cmd",
]
